<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="New Leaf University Admission CRM — University Admissions & Student Lifecycle Management">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>New Leaf University Admission CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/layout.css">
<link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/auth.css">
<!-- SheetJS 0.20.3 (Apache-2.0), bundled in src/vendor so Excel import/export work without internet -->
<script src="src/vendor/xlsx.full.min.js" defer></script>
</head>
<body>
<noscript>New Leaf University Admission CRM needs JavaScript enabled.</noscript>

<!-- Runtime configuration (generated by the server; an inert placeholder when opened from disk) -->
<script src="runtime-config.js"></script>

<!-- Configuration & utilities -->
<script src="src/config/config.js"></script>
<script src="src/utils/html.js"></script>
<script src="src/utils/format.js"></script>
<script src="src/utils/validate.js"></script>
<script src="src/utils/geo.js"></script>
<script src="src/utils/programs.js"></script>
<script src="src/utils/crypto.js" data-demo></script>
<script src="src/utils/file.js"></script>
<script src="src/auth/permissions.js"></script>
<script src="src/auth/passwordPolicy.js"></script>
<script src="src/auth/authValidation.js"></script>
<script src="src/js/outcomes.js"></script>

<!-- Demo backend (used only when APP_MODE === "demo"; the server omits these unless DEMO_MODE=true) -->
<script src="src/api/demoDb.js" data-demo></script>
<script src="src/api/seed.js" data-demo></script>
<script src="src/api/demoServer.js" data-demo></script>
<script src="src/api/demoRoutes.js" data-demo></script>
<script src="src/api/demoReports.js" data-demo></script>

<!-- API client, services, state -->
<script src="src/api/client.js"></script>
<script src="src/services/services.js"></script>
<script src="src/state/store.js"></script>
<script src="src/auth/authState.js"></script>

<!-- Components & shared workflows -->
<script src="src/components/ui.js"></script>
<script src="src/components/dataTable.js"></script>
<script src="src/components/filterBar.js"></script>
<script src="src/components/charts.js"></script>
<script src="src/components/widgets.js"></script>
<script src="src/components/listPage.js"></script>
<script src="src/components/assistant.js"></script>
<script src="src/modules/actions.js"></script>

<!-- Pages -->
<script src="src/pages/dashboard.js"></script>
<script src="src/pages/leads.js"></script>
<script src="src/pages/leadDetail.js"></script>
<script src="src/pages/students.js"></script>
<script src="src/pages/applications.js"></script>
<script src="src/pages/masters.js"></script>
<script src="src/pages/finance.js"></script>
<script src="src/pages/counselling.js"></script>
<script src="src/pages/operations.js"></script>
<script src="src/pages/import.js"></script>
<script src="src/pages/reports.js"></script>
<script src="src/pages/admin.js"></script>
<script src="src/pages/profile.js"></script>
<script src="src/pages/auth.js"></script>

<!-- Shell + router (boots the app) -->
<script src="src/app.js"></script>
</body>
</html>
